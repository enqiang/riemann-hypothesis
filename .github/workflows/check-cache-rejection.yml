name: Verify cache publication blocks failed acceptance
permissions:
  contents: read
  actions: read
jobs:
  stage:
    name: Stage against the public cache
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      receipt: ${{ steps.stage.outputs.receipt }}
    steps:
    - &id001
      name: Check out main's publishing code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.workflow_sha }}
        persist-credentials: false
        fetch-depth: 0
    - name: Choose the commit
      id: target
      env:
        SHA: 7c4ccbd64d02774b0a5b40a5f923f5b7a18e8abc
      run: '[[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be a full
        commit hash"; exit 1; }

        git cat-file -e "$SHA^{commit}" 2>/dev/null || git fetch --no-tags origin
        "$SHA"

        echo "sha=$SHA" >> "$GITHUB_OUTPUT"

        '
    - name: Reconstruct the public build's staging metadata
      env:
        SHA: ${{ steps.target.outputs.sha }}
      run: python3 -I scripts/cache-publication-harness.py fixture
    - name: Install elan and the commit's toolchain
      env:
        SHA: ${{ steps.target.outputs.sha }}
      run: "toolchain=$(git show \"$SHA:lean-toolchain\" | tr -d '[:space:]')\n[[\
        \ \"$toolchain\" =~ ^leanprover/lean4:v[0-9]+\\.[0-9]+\\.[0-9]+(-rc[0-9]+)?$\
        \ ]] || {\n  echo \"::error::unexpected toolchain $toolchain\"; exit 1; }\n\
        curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh\
        \ -o \"$RUNNER_TEMP/elan-init.sh\"\nsh \"$RUNNER_TEMP/elan-init.sh\" -y --default-toolchain\
        \ none --no-modify-path\n\"$HOME/.elan/bin/elan\" toolchain install \"$toolchain\"\
        \necho \"$HOME/.elan/bin\" >> \"$GITHUB_PATH\"\n"
    - name: Verify and stage the cache
      id: stage
      env:
        SHA: ${{ steps.target.outputs.sha }}
        PUBLISH: 'true'
      run: "# An artifact without new files has no artifacts/ directory.\nmkdir -p\
        \ \"$RUNNER_TEMP/staging/artifacts\"\nextra=()\nreceipt=\"$RUNNER_TEMP/candidate.json\"\
        \nif [[ \"$PUBLISH\" == true ]]; then\n  extra+=(--stage-receipt \"$receipt\"\
        )\nfi\npython3 -I scripts/cache-publication-harness.py --sha \"$SHA\" --staging\
        \ \"$RUNNER_TEMP/staging\" \"${extra[@]}\"\nif [[ \"$PUBLISH\" == true ]];\
        \ then\n  printf 'receipt=%s\\n' \"$(base64 -w 0 \"$receipt\")\" >> \"$GITHUB_OUTPUT\"\
        \nfi\n"
  reject:
    name: Reject a candidate for different build inputs
    needs: stage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: Check out the candidate's commit
      uses: actions/checkout@v4
      with:
        ref: ${{ needs.stage.outputs.sha }}
        path: project
        persist-credentials: false
    - name: Check out main's cache restore code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.workflow_sha }}
        path: cache-tools
        persist-credentials: false
    - name: Reject a different source tree
      working-directory: project
      env:
        RECEIPT: ${{ needs.stage.outputs.receipt }}
      run: 'printf ''%s'' "$RECEIPT" | base64 --decode > "$RUNNER_TEMP/rejected.json"

        python3 - "$RUNNER_TEMP/rejected.json" <<''PYTHON''

        import json

        from pathlib import Path

        import sys

        path = Path(sys.argv[1])

        receipt = json.loads(path.read_bytes())

        receipt["source_tree"] = "0" * 40

        path.write_text(json.dumps(receipt))

        PYTHON

        python3 -I ../cache-tools/scripts/ci-cache-get.py --candidate "$RUNNER_TEMP/rejected.json"

        '
      continue-on-error: false
  blocked_activation:
    name: Activation after failed acceptance
    needs:
    - stage
    - reject
    runs-on: ubuntu-latest
    steps:
    - run: exit 1
  gate:
    name: Check the failure gate and run regression tests
    if: always()
    needs:
    - reject
    - blocked_activation
    runs-on: ubuntu-latest
    steps:
    - env:
        REJECT: ${{ needs.reject.result }}
        ACTIVATION: ${{ needs.blocked_activation.result }}
      run: '[[ "$REJECT" == failure && "$ACTIVATION" == skipped ]]'
    - *id001
    - run: python3 -I -m unittest discover -s scripts/tests
'on':
  push:
    branches:
    - codex/verify-cache-activation
